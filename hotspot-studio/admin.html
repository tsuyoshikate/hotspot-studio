<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台管理 · 热点营销工作台</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="logo"><i>H</i><span>后台管理 <small>HotSpot Studio · Admin</small></span></div>
  <div class="sp"></div>
  <span id="srcBadge"></span>
  <a class="btn sm" href="eval.html">评测台</a>
  <a class="btn sm primary" href="index.html">← 返回工作台</a>
</header>
<div class="admin">
  <nav class="adnav" id="adnav"></nav>
  <main class="adbody" id="adbody"></main>
</div>
<div class="savebar">
  <span id="saveState" class="hint">没有未保存的改动</span>
  <span class="sp"></span>
  <button class="btn sm" id="btnExport">导出配置</button>
  <label class="btn sm" style="cursor:pointer">导入配置<input type="file" id="fileImport" accept=".json,application/json" hidden></label>
  <button class="btn sm" id="btnRestore" title="把上一次保存前的内容找回来">恢复上一版</button>
  <button class="btn sm" id="btnDiscard">放弃改动</button>
  <button class="btn primary" id="btnSave">保存 <span class="kbd" style="color:inherit;border-color:rgba(255,255,255,.4);background:transparent">Ctrl+S</span></button>
</div>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/core.js"></script>
<script src="js/llm.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-news.js"></script>
<script src="js/admin-prompts.js"></script>
<script src="js/admin-products.js"></script>
<script src="js/admin-personas.js"></script>
<script src="js/admin-materials.js"></script>
<script src="js/admin-styles.js"></script>
<script src="js/admin-model.js"></script>
<script>Admin.start();</script>
</body>
</html>
